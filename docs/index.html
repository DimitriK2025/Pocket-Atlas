<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="style.css?v=20261124122715">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1 id="title">Pocket <span>Atlas</span></h1>
      <div class="source" id="source"></div>
    </div>
    <div class="datapick">
      <select id="metric-select" aria-label="Choose a statistic to map"></select>
    </div>
  </header>
  <main class="main" id="main">
    <div class="controls">
      <div class="seg" role="group" aria-label="Geography level">
        <button id="lvl-state" data-level="state">States</button>
        <button id="lvl-county" data-level="county">Counties</button>
        <button id="lvl-zip" data-level="zip">ZIP codes</button>
        <button id="lvl-tract" data-level="tract">Tracts</button>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="view-map" data-view="map">Map</button>
        <button id="view-table" data-view="table">Table</button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="mapwrap">
      <div class="mapbox" id="mapbox">
        <svg id="map" aria-label="Choropleth map"></svg>
        <div class="zoomctl">
          <button id="zin" aria-label="Zoom in">+</button>
          <button id="zout" aria-label="Zoom out">−</button>
          <button id="zreset" aria-label="Reset zoom">⤢</button>
        </div>
        <div class="hint" id="maphint"></div>
        <div class="maploading" id="maploading" hidden></div>
        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="tablebox" id="tablebox" hidden></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>window.ATLAS_VERSION = "20261124122715";</script>
<script src="data/region.js?v=20261124122715"></script>
<script src="app.js?v=20261124122715"></script>
</body>
</html>
